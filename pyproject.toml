[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "commit-msg-guard"
version = "1.0.0"
description = "Production-grade Conventional Commits validator and git hook utility"
readme = "README.md"
authors = [{ name = "slopggobblercobbler81" }]
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["git", "git-hook", "conventional-commits", "commit-msg", "commitlint", "linter", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
commit-msg-guard = "commit_msg_guard.cli:main"

[project.urls]
Homepage = "https://github.com/slopggobblercobbler81/commit-msg-guard"
Repository = "https://github.com/slopggobblercobbler81/commit-msg-guard.git"
Issues = "https://github.com/slopggobblercobbler81/commit-msg-guard/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["commit_msg_guard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
